# Apache (Laragon) como proxy HTTPS delante de la api (manual de operación §3).
# Copiar a C:\laragon\etc\apache2\sites-enabled\ y reemplazar:
#   ventas.example.com  → el nombre con el que se entra al sistema (debe coincidir con WEB_ORIGIN)
#   rutas del certificado → certificado válido (Let's Encrypt, el de la empresa o uno interno)
# Requiere los módulos: mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_rewrite.
# La api escucha solo en 127.0.0.1:4000 (no se expone el puerto al exterior).

<VirtualHost *:80>
    ServerName ventas.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ventas.example.com

    SSLEngine on
    SSLCertificateFile    "C:/laragon/etc/ssl/ventas.example.com.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/ventas.example.com.key"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On
    ProxyRequests Off
    # El PDF de un comprobante puede tardar mientras API-PRO lo genera.
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    # Los encabezados de seguridad (CSP, HSTS, nosniff…) los pone la api con helmet.
    LimitRequestBody 2097152
    ErrorLog  "C:/laragon/www/sistemas-ventas-curso/apps/api/storage/logs/apache-error.log"
    CustomLog "C:/laragon/www/sistemas-ventas-curso/apps/api/storage/logs/apache-access.log" combined
</VirtualHost>
